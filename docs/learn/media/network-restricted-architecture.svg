<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Claude apps gateway on Azure in a network-restricted environment</title>
  <desc>Developer machines on the corporate network reach the gateway's private address in an Azure virtual network over ExpressRoute or VPN. Inside the virtual network, an internal Container Apps environment runs the gateway, which reaches Microsoft Foundry through a private endpoint and PostgreSQL Flexible Server through VNet integration. Private DNS zones resolve every name to a private address. Microsoft Entra ID signs developers in.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#323130"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#ffffff"/>

  <rect x="20" y="60" width="250" height="420" rx="10" fill="#f3f2f1" stroke="#8a8886" stroke-dasharray="6 4"/>
  <text x="36" y="88" font-weight="600">Corporate network</text>
  <text x="36" y="108" fill="#605e5c">ExpressRoute or VPN to the VNet</text>
  <rect x="40" y="130" width="210" height="60" rx="6" fill="#ffffff" stroke="#605e5c"/>
  <text x="54" y="156" font-weight="600">Claude Code CLI</text>
  <text x="54" y="176" fill="#605e5c">/login, Cloud gateway</text>
  <rect x="40" y="205" width="210" height="60" rx="6" fill="#ffffff" stroke="#605e5c"/>
  <text x="54" y="231" font-weight="600">VS Code extension</text>
  <text x="54" y="251" fill="#605e5c">bundled Claude Code</text>
  <rect x="40" y="280" width="210" height="60" rx="6" fill="#ffffff" stroke="#605e5c"/>
  <text x="54" y="306" font-weight="600">Claude Desktop</text>
  <text x="54" y="326" fill="#605e5c">bootstrapUrl</text>
  <rect x="40" y="365" width="210" height="95" rx="6" fill="#ffffff" stroke="#605e5c"/>
  <text x="54" y="390" font-weight="600">Managed policy</text>
  <text x="54" y="410" fill="#605e5c">Intune or Group Policy:</text>
  <text x="54" y="428" fill="#605e5c">HKLM\...\ClaudeCode,</text>
  <text x="54" y="446" fill="#605e5c">HKLM\...\Claude</text>

  <rect x="320" y="60" width="700" height="600" rx="10" fill="#eff6fc" stroke="#0078d4"/>
  <text x="336" y="88" font-weight="600" fill="#0078d4">Virtual network 10.40.0.0/16</text>

  <rect x="340" y="110" width="330" height="210" rx="8" fill="#ffffff" stroke="#0078d4"/>
  <text x="354" y="134" font-weight="600">snet-aca 10.40.0.0/23</text>
  <text x="354" y="154" fill="#605e5c">Container Apps environment, internal</text>
  <rect x="360" y="170" width="290" height="130" rx="6" fill="#deecf9" stroke="#0078d4"/>
  <text x="376" y="196" font-weight="600">Claude apps gateway</text>
  <text x="376" y="216" fill="#323130">Container App, 2 to N replicas</text>
  <text x="376" y="236" fill="#323130">HTTP scale rule, /readyz</text>
  <text x="376" y="256" fill="#323130">static IP, private DNS zone of</text>
  <text x="376" y="276" fill="#323130">the default domain</text>

  <rect x="700" y="110" width="300" height="140" rx="8" fill="#ffffff" stroke="#0078d4"/>
  <text x="714" y="134" font-weight="600">snet-pe 10.40.2.0/24</text>
  <text x="714" y="158" fill="#323130">Private endpoint, group account</text>
  <text x="714" y="182" fill="#605e5c">privatelink.cognitiveservices.azure.com</text>
  <text x="714" y="202" fill="#605e5c">privatelink.openai.azure.com</text>
  <text x="714" y="222" fill="#605e5c">privatelink.services.ai.azure.com</text>

  <rect x="700" y="270" width="300" height="100" rx="8" fill="#ffffff" stroke="#0078d4"/>
  <text x="714" y="294" font-weight="600">snet-pg 10.40.3.0/27</text>
  <text x="714" y="318" fill="#323130">PostgreSQL Flexible Server</text>
  <text x="714" y="338" fill="#605e5c">private access, TLS</text>

  <rect x="340" y="350" width="330" height="130" rx="8" fill="#ffffff" stroke="#0078d4"/>
  <text x="354" y="374" font-weight="600">snet-dev 10.40.3.32/27 (test only)</text>
  <text x="354" y="398" fill="#323130">Windows 11 developer VM</text>
  <text x="354" y="418" fill="#605e5c">Azure Bastion Developer</text>
  <text x="354" y="438" fill="#605e5c">NAT gateway for outbound traffic</text>
  <text x="354" y="458" fill="#605e5c">stands in for the corporate network</text>

  <rect x="340" y="510" width="660" height="130" rx="8" fill="#ffffff" stroke="#0078d4"/>
  <text x="354" y="534" font-weight="600">Shared by the deployment</text>
  <text x="354" y="558" fill="#323130">User-assigned identity: AcrPull, Cognitive Services User</text>
  <text x="354" y="580" fill="#323130">Container registry: gateway image from the signed Claude Code release</text>
  <text x="354" y="602" fill="#323130">Log Analytics workspace: console and audit logs</text>
  <text x="354" y="624" fill="#323130">Private DNS zones linked to the VNet</text>

  <rect x="1060" y="110" width="200" height="140" rx="8" fill="#fff4ce" stroke="#8a6d3b"/>
  <text x="1074" y="136" font-weight="600">Microsoft Foundry</text>
  <text x="1074" y="160" fill="#323130">claude-sonnet-5</text>
  <text x="1074" y="180" fill="#323130">claude-opus-5</text>
  <text x="1074" y="204" fill="#605e5c">public access: Disabled</text>
  <text x="1074" y="224" fill="#605e5c">keys: Disabled</text>

  <rect x="1060" y="300" width="200" height="110" rx="8" fill="#f3f2f1" stroke="#605e5c"/>
  <text x="1074" y="326" font-weight="600">Microsoft Entra ID</text>
  <text x="1074" y="350" fill="#323130">app registration,</text>
  <text x="1074" y="370" fill="#323130">app roles, OIDC</text>
  <text x="1074" y="390" fill="#605e5c">login.microsoftonline.com</text>

  <line x1="250" y1="160" x2="358" y2="220" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="235" x2="358" y2="235" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="310" x2="358" y2="250" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="206" fill="#323130">HTTPS</text>
  <line x1="650" y1="200" x2="698" y2="180" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="180" x2="1058" y2="180" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="270" x2="698" y2="315" stroke="#323130" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="290" x2="1058" y2="350" stroke="#605e5c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="840" y="410" fill="#605e5c">OIDC discovery and token (egress)</text>
  <line x1="505" y1="350" x2="505" y2="302" stroke="#605e5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="700" fill="#605e5c">Browser sign-in: developer machine to Microsoft Entra ID, then back to the gateway's /oauth/callback.</text>
  <text x="20" y="724" fill="#605e5c">Every host name resolves to a private address inside the VNet; the gateway has no public endpoint.</text>
</svg>
